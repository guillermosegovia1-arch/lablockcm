<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shackle / Accent Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Neon Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="12" />

  <!-- Background Ambient Glow behind shield -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" />

  <!-- Security Shield Outer Contour -->
  <path d="M256 76 L400 128 V248 C400 348 338 424 256 456 C174 424 112 348 112 248 V128 L256 76 Z"
        fill="url(#shieldGrad)"
        stroke="url(#neonBorder)"
        stroke-width="14"
        stroke-linejoin="round"
        filter="url(#shadowFilter)" />

  <!-- Modern Padlock Shackle (Thick for visibility at small icon size) -->
  <path d="M208 232 V196 C208 169.49 229.49 148 256 148 C282.51 148 304 169.49 304 196 V232"
        fill="none"
        stroke="url(#cyanAccent)"
        stroke-width="26"
        stroke-linecap="round" />

  <!-- Modern Padlock Body -->
  <rect x="180" y="232" width="152" height="124" rx="28"
        fill="#0b1120"
        stroke="url(#cyanAccent)"
        stroke-width="14" />

  <!-- Padlock Core / Keyhole Indicator -->
  <circle cx="256" cy="282" r="16" fill="#38bdf8" />
  <path d="M248 286 L244 322 H268 L264 286 Z" fill="#38bdf8" />

  <!-- Tech Accent Lines (Left and Right) -->
  <line x1="202" y1="294" x2="226" y2="294" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="286" y1="294" x2="310" y2="294" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Colegio Mexicano Indicator Dots (C-M Badge) -->
  <circle cx="256" cy="406" r="10" fill="#38bdf8" />
  <circle cx="220" cy="392" r="7" fill="#2563eb" />
  <circle cx="292" cy="392" r="7" fill="#2563eb" />
</svg>
