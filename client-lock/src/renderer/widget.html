<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabLock CM Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 2px;
    }
    .widget-container {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 10px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.6);
      color: #fff;
      -webkit-app-region: drag;
      cursor: grab;
    }
    .widget-container:active {
      cursor: grabbing;
    }
    .user-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 130px;
      pointer-events: none;
    }
    .user-name {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }
    .session-time {
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #38bdf8;
      font-weight: 600;
      line-height: 1.2;
    }
    .btn-end {
      -webkit-app-region: no-drag;
      background: rgba(239, 68, 68, 0.85);
      border: 1px solid rgba(254, 202, 202, 0.3);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.35);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-end:hover {
      background: rgba(239, 68, 68, 1);
      transform: scale(1.02);
      box-shadow: 0 3px 10px rgba(220, 38, 38, 0.5);
    }
    .btn-end:active {
      transform: scale(0.98);
    }
    .btn-end svg {
      width: 11px;
      height: 11px;
      stroke-width: 2.2;
    }
  </style>
</head>
<body>
  <div class="widget-container" title="Arrastra para mover el botón">
    <div class="user-info">
      <span id="widget-user" class="user-name">Cargando...</span>
      <span id="widget-timer" class="session-time">00:00:00</span>
    </div>

    <button id="btn-end-session" class="btn-end" title="Cerrar sesión al terminar tu clase">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Cerrar Sesión</span>
    </button>
  </div>

  <script>
    let startTime = Date.now();
    const widgetUser = document.getElementById('widget-user');
    const widgetTimer = document.getElementById('widget-timer');
    const btnEnd = document.getElementById('btn-end-session');

    function toTitleCase(str) {
      if (!str) return '';
      return str
        .toLowerCase()
        .split(' ')
        .filter(Boolean)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    async function loadSession() {
      if (window.lablockApi) {
        const session = await window.lablockApi.getCurrentSession();
        if (session && session.user) {
          const rawName = session.user.nombre || session.user.nombre_completo || 'Usuario';
          widgetUser.textContent = toTitleCase(rawName);
          if (session.session && session.session.hora_inicio) {
            startTime = new Date(session.session.hora_inicio).getTime();
          }
        }
      }
    }

    function updateTimer() {
      const elapsed = Math.max(0, Math.floor((Date.now() - startTime) / 1000));
      const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      widgetTimer.textContent = `${hrs}:${mins}:${secs}`;
    }

    btnEnd.addEventListener('click', () => {
      if (confirm('¿Deseas cerrar tu sesión y bloquear el equipo?')) {
        if (window.lablockApi) {
          window.lablockApi.triggerEndSession();
        }
      }
    });

    loadSession();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
