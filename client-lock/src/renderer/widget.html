<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabLock Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 4px;
    }
    .widget-container {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(59, 130, 246, 0.4);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
      color: #fff;
    }
    .user-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-width: 150px;
    }
    .user-name {
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f8fafc;
    }
    .session-time {
      font-size: 10px;
      font-family: monospace;
      color: #60a5fa;
      font-weight: 600;
    }
    .btn-end {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
      transition: all 0.2s;
    }
    .btn-end:hover {
      background: linear-gradient(135deg, #f87171, #ef4444);
      transform: scale(1.02);
    }
    .btn-minimize {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      margin-left: 4px;
    }
    .btn-minimize:hover {
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="user-info">
      <span id="widget-user" class="user-name">Cargando...</span>
      <span id="widget-timer" class="session-time">00:00:00</span>
    </div>

    <div style="display: flex; align-items: center;">
      <button id="btn-end-session" class="btn-end" title="Cerrar sesión al terminar tu clase">
        <span>Cerrar Sesión</span>
      </button>

      <button id="btn-min" class="btn-minimize" title="Ocultar widget (permanece en la bandeja)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <script>
    let startTime = Date.now();
    const widgetUser = document.getElementById('widget-user');
    const widgetTimer = document.getElementById('widget-timer');
    const btnEnd = document.getElementById('btn-end-session');
    const btnMin = document.getElementById('btn-min');

    async function loadSession() {
      if (window.lablockApi) {
        const session = await window.lablockApi.getCurrentSession();
        if (session && session.user) {
          widgetUser.textContent = session.user.nombre || session.user.nombre_completo;
          if (session.session && session.session.hora_inicio) {
            startTime = new Date(session.session.hora_inicio).getTime();
          }
        }
      }
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      const hrs = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      const mins = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const secs = String(elapsed % 60).padStart(2, '0');
      widgetTimer.textContent = `${hrs}:${mins}:${secs}`;
    }

    btnEnd.addEventListener('click', () => {
      if (confirm('¿Deseas cerrar tu sesión y bloquear el equipo?')) {
        if (window.lablockApi) {
          window.lablockApi.onRequestEndSession(() => {});
          // Mandar al main para ejecutar fin de sesión
          window.location.href = 'about:blank';
        }
      }
    });

    btnMin.addEventListener('click', () => {
      if (window.lablockApi) {
        window.lablockApi.minimizeWidget();
      }
    });

    loadSession();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
