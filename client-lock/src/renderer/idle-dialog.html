<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviso de Inactividad - LabLock CM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 12px;
    }
    .dialog-card {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px rgba(245, 158, 11, 0.25);
      border-radius: 18px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
      color: #fff;
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fbbf24;
      flex-shrink: 0;
      animation: pulseAlert 2s infinite ease-in-out;
    }
    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .title-box h2 {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }
    .title-box p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .content-box {
      text-align: center;
      padding: 10px 0;
    }
    .alert-msg {
      font-size: 14px;
      font-weight: 600;
      color: #fde68a;
      margin-bottom: 8px;
    }
    .countdown-wrapper {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 12px;
    }
    .countdown-number {
      font-size: 26px;
      font-weight: 800;
      color: #ef4444;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      min-width: 38px;
    }
    .countdown-label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .buttons-row {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-ok {
      background: rgba(239, 68, 68, 0.9);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
    }
    .btn-ok:hover {
      background: #dc2626;
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.5);
    }
    .btn-cancel {
      background: rgba(59, 130, 246, 0.85);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
    }
    .btn-cancel:hover {
      background: #2563eb;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body>
  <div class="dialog-card">
    <div class="header-row">
      <div class="icon-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="title-box">
        <h2>Inactividad Detectada</h2>
        <p>LabLock CM • Colegio Mexicano</p>
      </div>
    </div>

    <div class="content-box">
      <div class="alert-msg">Se cerrará la sesión del alumno</div>
      <div class="countdown-wrapper">
        <span class="countdown-number" id="countdown-num">60</span>
        <span class="countdown-label">segundos para cerrar sesión</span>
      </div>
    </div>

    <div class="buttons-row">
      <button id="btn-cancel" class="btn btn-cancel" title="Presiona Cancelar para continuar tu clase">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Cancelar (Regresar)</span>
      </button>

      <button id="btn-ok" class="btn btn-ok" title="Cerrar la sesión de inmediato">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Ok (Cerrar Sesión)</span>
      </button>
    </div>
  </div>

  <script>
    let remaining = 60;
    const countdownEl = document.getElementById('countdown-num');
    const btnOk = document.getElementById('btn-ok');
    const btnCancel = document.getElementById('btn-cancel');

    let closed = false;

    function handleOk() {
      if (closed) return;
      closed = true;
      if (window.lablockApi && window.lablockApi.confirmIdleEndSession) {
        window.lablockApi.confirmIdleEndSession();
      }
    }

    function handleCancel() {
      if (closed) return;
      closed = true;
      if (window.lablockApi && window.lablockApi.cancelIdleWarning) {
        window.lablockApi.cancelIdleWarning();
      }
    }

    btnOk.addEventListener('click', handleOk);
    btnCancel.addEventListener('click', handleCancel);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        handleCancel();
      } else if (e.key === 'Enter') {
        handleOk();
      }
    });

    const timer = setInterval(() => {
      remaining--;
      if (countdownEl) {
        countdownEl.textContent = String(remaining);
      }

      if (remaining <= 0) {
        clearInterval(timer);
        handleOk();
      }
    }, 1000);
  </script>
</body>
</html>
